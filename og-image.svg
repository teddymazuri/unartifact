    <circle cx="840" cy="120" r="1"/><circle cx="920" cy="120" r="1"/>
    <circle cx="1000" cy="120" r="1"/><circle cx="1080" cy="120" r="1"/>
    <circle cx="1160" cy="120" r="1"/>
    <circle cx="40" cy="200" r="1"/><circle cx="120" cy="200" r="1"/>
