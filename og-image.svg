    <circle cx="1000" cy="40" r="1"/><circle cx="1080" cy="40" r="1"/>
    <circle cx="1160" cy="40" r="1"/>
    <circle cx="40" cy="120" r="1"/><circle cx="120" cy="120" r="1"/>
    <circle cx="200" cy="120" r="1"/><circle cx="280" cy="120" r="1"/>
    <circle cx="360" cy="120" r="1"/><circle cx="440" cy="120" r="1"/>
