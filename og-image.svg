  </text>

  <!-- Privacy badge -->
  <g transform="translate(380, 380)">
    <rect x="0" y="0" width="360" height="56" rx="28"
          fill="#10B981" fill-opacity="0.15"
          stroke="#10B981" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="6" fill="#10B981"/>
    <text x="48" y="36"
          font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="20" font-weight="600" fill="#6EE7B7">
      Zero data leaves your browser
    </text>
  </g>

  <!-- Bottom stats row -->
  <g transform="translate(120, 500)"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     fill="#94A3B8" font-size="18" font-weight="500">
    <text x="0" y="0">No uploads</text>
    <circle cx="110" cy="-6" r="2" fill="#475569"/>
    <text x="130" y="0">No telemetry</text>
    <circle cx="255" cy="-6" r="2" fill="#475569"/>
    <text x="275" y="0">No backend</text>
    <circle cx="390" cy="-6" r="2" fill="#475569"/>
    <text x="410" y="0">.doc &amp; .docx</text>
  </g>

  <!-- Corner stripe accent -->
  <path d="M 1200 630 L 1200 560 L 1130 630 Z" fill="#4F46E5" opacity="0.4"/>
  <path d="M 1200 630 L 1200 590 L 1160 630 Z" fill="#10B981" opacity="0.6"/>
</svg>