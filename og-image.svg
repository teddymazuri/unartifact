  <!-- Brand mark (large, left side) -->
  <g transform="translate(120, 165)">
    <rect x="0" y="0" width="200" height="200" rx="40" fill="url(#tile)"/>

    <g mask="url(#erase)">
      <path d="M 44 38 Q 44 32 50 32 L 130 32 L 156 58 L 156 162 Q 156 168 150 168 L 50 168 Q 44 168 44 162 Z"
            fill="url(#page)"/>
      <path d="M 130 32 L 156 58 L 130 58 Z" fill="#C7D2FE"/>
      <rect x="62" y="80" width="66" height="9" rx="4.5" fill="#4F46E5" opacity="0.85"/>
      <rect x="62" y="106" width="78" height="9" rx="4.5" fill="#4F46E5" opacity="0.65"/>
      <rect x="62" y="132" width="52" height="9" rx="4.5" fill="#4F46E5" opacity="0.45"/>
    </g>

    <circle cx="150" cy="150" r="34" fill="url(#glow)"/>
    <path d="M 150 126 L 156.8 143.2 L 174 150 L 156.8 156.8 L 150 174 L 143.2 156.8 L 126 150 L 143.2 143.2 Z"
          fill="#10B981"/>
    <circle cx="150" cy="150" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <text x="380" y="270"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="96" font-weight="800" fill="#FFFFFF" letter-spacing="-2">
