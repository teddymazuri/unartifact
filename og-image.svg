    <circle cx="360" cy="200" r="1"/><circle cx="440" cy="200" r="1"/>
    <circle cx="520" cy="200" r="1"/><circle cx="600" cy="200" r="1"/>
    <circle cx="680" cy="200" r="1"/><circle cx="760" cy="200" r="1"/>
    <circle cx="840" cy="200" r="1"/><circle cx="920" cy="200" r="1"/>
    <circle cx="1000" cy="200" r="1"/><circle cx="1080" cy="200" r="1"/>
    <circle cx="1160" cy="200" r="1"/>
    <circle cx="40" cy="280" r="1"/><circle cx="120" cy="280" r="1"/>
    <circle cx="200" cy="280" r="1"/><circle cx="280" cy="280" r="1"/>
    <circle cx="360" cy="280" r="1"/><circle cx="440" cy="280" r="1"/>
    <circle cx="520" cy="280" r="1"/><circle cx="600" cy="280" r="1"/>
    <circle cx="680" cy="280" r="1"/><circle cx="760" cy="280" r="1"/>
    <circle cx="840" cy="280" r="1"/><circle cx="920" cy="280" r="1"/>
    <circle cx="1000" cy="280" r="1"/><circle cx="1080" cy="280" r="1"/>
    <circle cx="1160" cy="280" r="1"/>
    <circle cx="40" cy="360" r="1"/><circle cx="120" cy="360" r="1"/>
    <circle cx="200" cy="360" r="1"/><circle cx="280" cy="360" r="1"/>
